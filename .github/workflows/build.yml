name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - uses: fregante/setup-git-user@v1
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: yarn
          cache-dependency-path: |
            client/package.json
            client/yarn.lock

      - name: Prepare
        run: |
          npm i -g corepack
          corepack enable

      - name: Build website
        run: |
          cd client
          yarn --frozen-lockfile
          yarn build
          rm -r ../server/build
          mv build ../server/build

      - name: Commit changes
        run: |
          git add -A
          git diff-index --quiet HEAD || git commit -m 'Deploy ${{ github.sha }}'
          git push

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: server/build
